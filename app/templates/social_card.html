<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ seo_title }}</title>
    <meta name="description" content="{{ seo_desc }}">
    <meta name="robots" content="index,follow,max-image-preview:large">
    <link rel="canonical" href="{{ page_url }}">
    <meta property="og:type" content="article">
    <meta property="og:site_name" content="{{ site_name }}">
    <meta property="og:locale" content="{{ 'ko_KR' if lang == 'ko' else 'en_US' }}">
    <meta property="og:title" content="{{ seo_title }}">
    <meta property="og:description" content="{{ seo_desc }}">
    <meta property="og:url" content="{{ card_url }}">
    <meta property="og:image" content="{{ og_image_abs }}">
    <meta property="og:image:secure_url" content="{{ og_image_abs }}">
    <meta property="og:image:type" content="image/jpeg">
    <meta property="og:image:width" content="{{ og_image_width }}">
    <meta property="og:image:height" content="{{ og_image_height }}">
    <meta property="og:image:alt" content="{{ seo_title }}">
    <meta name="twitter:card" content="summary_large_image">
    <meta property="twitter:card" content="summary_large_image">
    <meta name="twitter:site" content="@x_starfulbiz">
    <meta name="twitter:title" content="{{ seo_title }}">
    <meta name="twitter:description" content="{{ seo_desc }}">
    <meta name="twitter:image" content="{{ og_image_abs }}">
    <meta property="twitter:image" content="{{ og_image_abs }}">
    <meta name="twitter:image:alt" content="{{ seo_title }}">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <main class="detail-container social-preview-page">
        <div class="social-preview-card">
            <div class="social-preview-media">
                <img src="{{ og_image_abs }}" alt="{{ seo_title }}" width="1200" height="630" loading="eager">
                <div class="social-preview-scrim" aria-hidden="true"></div>
                <h1 class="social-preview-title-overlay">{{ title }}</h1>
            </div>
        </div>
        <p class="social-preview-desc">{{ seo_desc }}</p>
        <p class="social-preview-link"><a href="{{ page_url }}">{{ '페이지 보기 →' if lang == 'ko' else 'View page →' }}</a></p>
    </main>
</body>
</html>
